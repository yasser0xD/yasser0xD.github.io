<body class="antialiased">

    <span class="text-accent fw-bold tracking-widest text-uppercase small mb-2">Error 404</span>
    <h1 class="display-1 fw-900 text-gradient mb-2" style="font-size:clamp(5rem,18vw,9rem);line-height:1">404</h1>
    <h2 class="fw-900 mb-3">Page not found</h2>
    <p class="text-secondary-color fs-5 mb-4" style="max-width:520px">

    </p>
    <a href="/" class="btn btn-primary rounded-pill px-4 py-2 hover-lift shadow-accent">
